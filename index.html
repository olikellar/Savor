<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Savor — Recipe Vault</title>

  <!-- iOS PWA Configuration -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Savor">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea { user-select: auto; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-900 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- ================= TOP HEADER ================= -->
  <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-zinc-200/80 px-4 py-3 flex items-center justify-between">
    <div>
      <h1 class="text-xl font-bold tracking-tight text-zinc-900">Savor</h1>
      <p id="syncStatus" class="text-xs text-zinc-500 flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-amber-400 inline-block"></span> Local only
      </p>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="openSyncModal()" class="p-2 rounded-full hover:bg-zinc-100 text-zinc-600 transition">
        <i data-lucide="cloud" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <!-- ================= MAIN CONTENT VIEWS ================= -->
  <main class="flex-1 overflow-y-auto pb-24 px-4 pt-4 max-w-xl mx-auto w-full">
    
    <!-- VIEW 1: RECIPES LIST -->
    <section id="view-recipes" class="space-y-4">
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-3.5 text-zinc-400"></i>
        <input type="text" id="searchInput" oninput="renderRecipes()" placeholder="Search recipes, ingredients, tags..."
          class="w-full bg-zinc-100/90 rounded-2xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 border border-transparent focus:bg-white transition">
      </div>

      <!-- Category Filter Pills -->
      <div id="categoryPills" class="flex gap-2 overflow-x-auto hide-scrollbar py-1 text-xs font-medium">
        <button onclick="filterCategory('All')" class="cat-pill active bg-zinc-900 text-white px-3.5 py-1.5 rounded-full">All</button>
        <button onclick="filterCategory('Dinner')" class="cat-pill bg-zinc-200/70 text-zinc-700 px-3.5 py-1.5 rounded-full">Dinner</button>
        <button onclick="filterCategory('Baking')" class="cat-pill bg-zinc-200/70 text-zinc-700 px-3.5 py-1.5 rounded-full">Baking</button>
        <button onclick="filterCategory('Quick')" class="cat-pill bg-zinc-200/70 text-zinc-700 px-3.5 py-1.5 rounded-full">Quick</button>
      </div>

      <!-- Recipe Cards Grid -->
      <div id="recipeList" class="grid grid-cols-1 gap-3.5"></div>
    </section>

    <!-- VIEW 2: SHOPPING LIST -->
    <section id="view-shopping" class="hidden space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold">Shopping List</h2>
        <button onclick="clearCheckedGrocery()" class="text-xs text-rose-600 font-medium">Clear Checked</button>
      </div>

      <div class="flex gap-2">
        <input type="text" id="newGroceryInput" placeholder="Add custom item..." 
          class="flex-1 bg-zinc-100 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
        <button onclick="addCustomGrocery()" class="bg-zinc-900 text-white px-4 py-2 rounded-xl text-sm font-medium">Add</button>
      </div>

      <div id="shoppingListContainer" class="space-y-2 pt-2"></div>
    </section>
  </main>

  <!-- ================= BOTTOM NAVIGATION BAR ================= -->
  <nav class="fixed bottom-0 left-0 right-0 z-30 bg-white/90 backdrop-blur-md border-t border-zinc-200 px-6 py-2 flex justify-around items-center max-w-xl mx-auto">
    <button onclick="switchTab('recipes')" id="tab-recipes" class="nav-tab active flex flex-col items-center text-emerald-600 gap-1">
      <i data-lucide="book-open" class="w-5 h-5"></i>
      <span class="text-[10px] font-semibold">Recipes</span>
    </button>
    <button onclick="openRecipeEditor()" class="flex flex-col items-center text-zinc-400 hover:text-zinc-900 gap-1">
      <div class="bg-emerald-600 text-white p-2.5 rounded-full shadow-lg shadow-emerald-600/30 -mt-5">
        <i data-lucide="plus" class="w-5 h-5"></i>
      </div>
      <span class="text-[10px] font-medium text-zinc-600">Add</span>
    </button>
    <button onclick="switchTab('shopping')" id="tab-shopping" class="nav-tab flex flex-col items-center text-zinc-400 gap-1">
      <i data-lucide="shopping-bag" class="w-5 h-5"></i>
      <span class="text-[10px] font-semibold">Groceries</span>
    </button>
  </nav>

  <!-- ================= RECIPE DETAIL / COOKING MODAL ================= -->
  <div id="recipeDetailModal" class="fixed inset-0 z-40 bg-white hidden flex flex-col overflow-y-auto">
    <div class="sticky top-0 bg-white/90 backdrop-blur-md border-b border-zinc-200 p-4 flex items-center justify-between">
      <button onclick="closeRecipeDetail()" class="text-zinc-600 p-1"><i data-lucide="arrow-left" class="w-6 h-6"></i></button>
      <div class="flex items-center gap-3">
        <button id="wakeLockBtn" onclick="toggleWakeLock()" title="Keep screen awake" class="flex items-center gap-1.5 text-xs bg-zinc-100 px-3 py-1.5 rounded-full font-medium text-zinc-700">
          <i data-lucide="sun" class="w-4 h-4"></i> Keep Awake
        </button>
        <button onclick="editCurrentRecipe()" class="text-zinc-600 p-1"><i data-lucide="edit-3" class="w-5 h-5"></i></button>
      </div>
    </div>

    <div class="p-6 max-w-xl mx-auto w-full space-y-6 pb-28">
      <div id="detailHeader"></div>
      
      <div>
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-sm font-bold uppercase tracking-wider text-zinc-400">Ingredients</h3>
          <button onclick="addRecipeIngredientsToGrocery()" class="text-xs text-emerald-600 font-semibold flex items-center gap-1">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i> Add to Groceries
          </button>
        </div>
        <div id="detailIngredients" class="space-y-2"></div>
      </div>

      <div>
        <h3 class="text-sm font-bold uppercase tracking-wider text-zinc-400 mb-2">Instructions</h3>
        <div id="detailInstructions" class="space-y-3"></div>
      </div>
    </div>
  </div>

  <!-- ================= RECIPE EDITOR MODAL ================= -->
  <div id="recipeEditorModal" class="fixed inset-0 z-50 bg-black/50 hidden backdrop-blur-sm flex items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-2xl max-h-[90vh] overflow-y-auto p-6 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b pb-3">
        <h3 id="editorTitle" class="text-lg font-bold">New Recipe</h3>
        <button onclick="closeRecipeEditor()" class="text-zinc-400"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <input type="hidden" id="editRecipeId">
      <div>
        <label class="text-xs font-semibold text-zinc-500">Title</label>
        <input type="text" id="editName" class="w-full mt-1 border rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="e.g. Garlic Butter Pasta">
      </div>

      <div class="grid grid-cols-3 gap-2">
        <div>
          <label class="text-xs font-semibold text-zinc-500">Prep (m)</label>
          <input type="number" id="editPrep" class="w-full mt-1 border rounded-xl p-2 text-sm outline-none" placeholder="10">
        </div>
        <div>
          <label class="text-xs font-semibold text-zinc-500">Cook (m)</label>
          <input type="number" id="editCook" class="w-full mt-1 border rounded-xl p-2 text-sm outline-none" placeholder="15">
        </div>
        <div>
          <label class="text-xs font-semibold text-zinc-500">Tag</label>
          <input type="text" id="editTag" class="w-full mt-1 border rounded-xl p-2 text-sm outline-none" placeholder="Dinner">
        </div>
      </div>

      <div>
        <label class="text-xs font-semibold text-zinc-500">Ingredients (One per line)</label>
        <textarea id="editIngredients" rows="4" class="w-full mt-1 border rounded-xl p-2.5 text-sm outline-none" placeholder="200g Spaghetti&#10;3 cloves Garlic, sliced&#10;2 tbsp Olive oil"></textarea>
      </div>

      <div>
        <label class="text-xs font-semibold text-zinc-500">Instructions (One step per line)</label>
        <textarea id="editInstructions" rows="4" class="w-full mt-1 border rounded-xl p-2.5 text-sm outline-none" placeholder="Boil pasta in salted water.&#10;Sauté garlic in olive oil until golden.&#10;Toss pasta with oil and serve."></textarea>
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="deleteCurrentEditingRecipe()" id="btnDeleteRecipe" class="hidden text-rose-600 bg-rose-50 px-4 py-2.5 rounded-xl text-sm font-semibold">Delete</button>
        <button onclick="saveRecipe()" class="flex-1 bg-emerald-600 text-white py-2.5 rounded-xl text-sm font-semibold shadow-md shadow-emerald-600/20">Save Recipe</button>
      </div>
    </div>
  </div>

  <!-- ================= GOOGLE
