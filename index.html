<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Savor — Recipe Vault</title>

  <!-- Favicon & iOS Home Screen Icon: Cooking Pot in Rust-Red on Orange -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='128' fill='%23f97316'/%3E%3Cpath d='M70 230 C 40 230, 40 290, 70 290 L 96 290 L 96 230 Z' fill='%23991b1b'/%3E%3Cpath d='M442 230 C 472 230, 472 290, 442 290 L 416 290 L 416 230 Z' fill='%23991b1b'/%3E%3Cpath d='M96 210 L 416 210 C 416 210, 416 380, 256 380 C 96 380, 96 210, 96 210 Z' fill='%23991b1b'/%3E%3Crect x='86' y='195' width='340' height='25' rx='10' fill='%237f1d1d'/%3E%3Cpath d='M120 195 C 150 140, 362 140, 392 195 Z' fill='%23991b1b'/%3E%3Cellipse cx='256' cy='135' rx='30' ry='16' fill='%237f1d1d'/%3E%3Cpath d='M200 90 Q 215 70 200 50' stroke='%23ffedd5' stroke-width='8' stroke-linecap='round' fill='none'/%3E%3Cpath d='M256 80 Q 270 60 256 40' stroke='%23ffedd5' stroke-width='8' stroke-linecap='round' fill='none'/%3E%3Cpath d='M312 90 Q 325 70 312 50' stroke='%23ffedd5' stroke-width='8' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='128' fill='%23f97316'/%3E%3Cpath d='M70 230 C 40 230, 40 290, 70 290 L 96 290 L 96 230 Z' fill='%23991b1b'/%3E%3Cpath d='M442 230 C 472 230, 472 290, 442 290 L 416 290 L 416 230 Z' fill='%23991b1b'/%3E%3Cpath d='M96 210 L 416 210 C 416 210, 416 380, 256 380 C 96 380, 96 210, 96 210 Z' fill='%23991b1b'/%3E%3Crect x='86' y='195' width='340' height='25' rx='10' fill='%237f1d1d'/%3E%3Cpath d='M120 195 C 150 140, 362 140, 392 195 Z' fill='%23991b1b'/%3E%3Cellipse cx='256' cy='135' rx='30' ry='16' fill='%237f1d1d'/%3E%3Cpath d='M200 90 Q 215 70 200 50' stroke='%23ffedd5' stroke-width='8' stroke-linecap='round' fill='none'/%3E%3Cpath d='M256 80 Q 270 60 256 40' stroke='%23ffedd5' stroke-width='8' stroke-linecap='round' fill='none'/%3E%3Cpath d='M312 90 Q 325 70 312 50' stroke='%23ffedd5' stroke-width='8' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">

  <!-- iOS PWA Configuration -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Savor">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            accent: 'var(--accent)',
            'accent-hover': 'var(--accent-hover)',
            'accent-subtle': 'var(--accent-subtle)',
            'accent-text': 'var(--accent-text)',
          }
        }
      }
    }
  </script>

  <!-- Google Identity Services (Drive OAuth) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    /* Dynamic Theme Accent Palettes */
    :root {
      --accent: #10b981;
      --accent-hover: #059669;
      --accent-subtle: #ecfdf5;
      --accent-text: #047857;
    }
    [data-theme-color="rust"] {
      --accent: #ea580c;
      --accent-hover: #c2410c;
      --accent-subtle: #fff7ed;
      --accent-text: #9a3412;
    }
    [data-theme-color="amber"] {
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --accent-subtle: #fffbeb;
      --accent-text: #b45309;
    }
    [data-theme-color="indigo"] {
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-subtle: #eef2ff;
      --accent-text: #4338ca;
    }
    [data-theme-color="rose"] {
      --accent: #f43f5e;
      --accent-hover: #e11d48;
      --accent-subtle: #fff1f2;
      --accent-text: #be123c;
    }
    [data-theme-color="violet"] {
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --accent-subtle: #f5f3ff;
      --accent-text: #6d28d9;
    }

    .dark {
      --accent-subtle: #182721;
      --accent-text: #34d399;
    }
    .dark[data-theme-color="rust"] {
      --accent-subtle: #2d180f;
      --accent-text: #fb923c;
    }
    .dark[data-theme-color="amber"] {
      --accent-subtle: #2b1f0d;
      --accent-text: #fbbf24;
    }
    .dark[data-theme-color="indigo"] {
      --accent-subtle: #191c33;
      --accent-text: #818cf8;
    }
    .dark[data-theme-color="rose"] {
      --accent-subtle: #2b1118;
      --accent-text: #fb7185;
    }
    .dark[data-theme-color="violet"] {
      --accent-subtle: #221438;
      --accent-text: #a78bfa;
    }

    body {
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea { user-select: auto; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 font-sans antialiased min-h-screen flex flex-col justify-between transition-colors duration-200">

  <!-- ================= VERSION BADGE (Bottom-Right) ================= -->
  <div class="fixed bottom-2 right-2.5 z-20 text-[9px] font-mono font-bold tracking-wider px-2 py-0.5 rounded-md bg-white/85 dark:bg-zinc-900/85 text-zinc-500 dark:text-zinc-400 border border-zinc-200 dark:border-zinc-800 shadow-xs pointer-events-none select-none">
    v1.3.0
  </div>

  <!-- ================= IN-APP TOAST NOTIFICATION ================= -->
  <div id="toastNotification" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-300 opacity-0 -translate-y-4 max-w-sm w-[90%]">
    <div class="bg-zinc-900/95 dark:bg-zinc-100 dark:text-zinc-900 text-white px-4 py-3 rounded-2xl shadow-xl backdrop-blur-md flex items-center gap-3 border border-zinc-700/50 dark:border-zinc-300">
      <div id="toastIcon" class="w-6 h-6 rounded-full bg-accent/20 text-accent flex items-center justify-center text-xs font-bold">✨</div>
      <p id="toastMessage" class="text-xs font-medium leading-snug flex-1"></p>
    </div>
  </div>

  <!-- ================= TOP HEADER (Blur-Free) ================= -->
  <header class="sticky top-0 z-30 bg-white dark:bg-zinc-900 border-b border-zinc-200 dark:border-zinc-800 px-4 pb-3 flex items-center justify-between"
          style="padding-top: max(env(safe-area-inset-top), 14px);">
    <div>
      <h1 class="text-xl font-black tracking-tight text-zinc-900 dark:text-white">Savor</h1>
      <p id="syncStatus" class="text-xs text-zinc-500 dark:text-zinc-400 flex items-center gap-1.5 mt-0.5">
        <span class="w-2 h-2 rounded-full bg-amber-400 inline-block"></span> Local only
      </p>
    </div>
    
    <div class="flex items-center gap-2">
      <!-- AI Import Button -->
      <button onclick="openImportModal()" class="px-3 py-1.5 rounded-full bg-accent-subtle hover:opacity-90 text-accent-text border border-accent/20 transition flex items-center gap-1.5 text-xs font-bold active:scale-95">
        <svg class="w-3.5 h-3.5 text-accent" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456z"/></svg>
        <span>AI Import</span>
      </button>

      <!-- Settings Button -->
      <button onclick="openSettingsModal()" class="p-2 rounded-full bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-300 hover:bg-zinc-200 dark:hover:bg-zinc-700 transition active:scale-95">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 0 1 0 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.869a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 0 1 0-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </header>

  <!-- ================= MAIN CONTENT VIEWS ================= -->
  <main class="flex-1 overflow-y-auto pb-28 px-4 pt-4 max-w-xl mx-auto w-full">
    
    <!-- VIEW 1: RECIPES LIST -->
    <section id="view-recipes" class="space-y-4">
      <div class="relative">
        <svg class="w-4 h-4 absolute left-3.5 top-3.5 text-zinc-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" oninput="renderRecipes()" placeholder="Search recipes, ingredients, tags..."
          class="w-full bg-zinc-100 dark:bg-zinc-800/80 rounded-2xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent border border-transparent dark:text-white transition">
      </div>

      <!-- Dynamic Category Filter Pills -->
      <div id="categoryPills" class="flex gap-2 overflow-x-auto hide-scrollbar py-1 text-xs font-semibold">
        <!-- Rendered by JS -->
      </div>

      <!-- Recipe Cards Grid -->
      <div id="recipeList" class="grid grid-cols-1 gap-3.5"></div>
    </section>

    <!-- VIEW 2: SHOPPING LIST -->
    <section id="view-shopping" class="hidden space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold">Shopping List</h2>
        <button onclick="clearCheckedGrocery()" class="text-xs text-rose-600 font-semibold">Clear Checked</button>
      </div>

      <div class="flex gap-2">
        <input type="text" id="newGroceryInput" placeholder="Add custom item..." 
          class="flex-1 bg-zinc-100 dark:bg-zinc-800 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent dark:text-white">
        <button onclick="addCustomGrocery()" class="bg-zinc-900 dark:bg-zinc-100 dark:text-zinc-900 text-white px-4 py-2 rounded-xl text-sm font-semibold active:scale-95 transition">Add</button>
      </div>

      <div id="shoppingListContainer" class="space-y-2 pt-2"></div>
    </section>
  </main>

  <!-- ================= BOTTOM NAVIGATION BAR ================= -->
  <nav class="fixed bottom-0 left-0 right-0 z-30 bg-white/95 dark:bg-zinc-900/95 backdrop-blur-md border-t border-zinc-200 dark:border-zinc-800 px-6 py-2.5 flex justify-around items-center max-w-xl mx-auto shadow-sm">
    <button onclick="switchTab('recipes')" id="tab-recipes" class="nav-tab text-accent flex flex-col items-center gap-1">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M6 2v20"/></svg>
      <span class="text-[10px] font-bold">Recipes</span>
    </button>
    <button onclick="openRecipeEditor()" class="flex flex-col items-center text-zinc-400 hover:text-zinc-900 dark:hover:text-white gap-1">
      <div class="bg-accent text-white p-3 rounded-full shadow-lg shadow-accent/30 -mt-6 active:scale-95 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14"/></svg>
      </div>
      <span class="text-[10px] font-semibold text-zinc-700 dark:text-zinc-300">Add</span>
    </button>
    <button onclick="switchTab('shopping')" id="tab-shopping" class="nav-tab text-zinc-400 flex flex-col items-center gap-1">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M3 6h18"/><path stroke-linecap="round" stroke-linejoin="round" d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span class="text-[10px] font-bold">Groceries</span>
    </button>
  </nav>

  <!-- ================= RECIPE DETAIL / COOKING MODAL ================= -->
  <div id="recipeDetailModal" class="fixed inset-0 z-40 bg-white dark:bg-zinc-950 hidden flex flex-col overflow-y-auto">
    <!-- Header with Safe-Area Inset Support & High-Touch Back Target -->
    <div class="sticky top-0 z-20 bg-white dark:bg-zinc-900 border-b border-zinc-200 dark:border-zinc-800 px-4 pb-3 flex items-center justify-between shadow-xs"
         style="padding-top: max(env(safe-area-inset-top), 14px);">
      <!-- Prominent iOS Back Button -->
      <button onclick="closeRecipeDetail()" class="flex items-center gap-1 text-accent active:opacity-75 -ml-2 px-3 py-2 rounded-xl transition font-semibold text-sm">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m15 19-7-7 7-7"/></svg>
        <span>Back</span>
      </button>

      <div class="flex items-center gap-2">
        <!-- Sun Icon Fix (Official Lucide SVG) -->
        <button id="wakeLockBtn" onclick="toggleWakeLock()" class="flex items-center gap-1 text-xs bg-zinc-100 dark:bg-zinc-800 active:bg-zinc-200 dark:active:bg-zinc-700 px-3 py-2 rounded-full font-medium text-zinc-700 dark:text-zinc-300">
          <svg class="w-4 h-4 inline-block text-zinc-500 dark:text-zinc-400" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          <span>Keep Awake</span>
        </button>
        <button onclick="editCurrentRecipe()" class="text-zinc-600 dark:text-zinc-300 bg-zinc-100 dark:bg-zinc-800 active:bg-zinc-200 p-2 rounded-full">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
        </button>
      </div>
    </div>

    <!-- Recipe Detail Content -->
    <div class="p-6 max-w-xl mx-auto w-full space-y-6 pb-28">
      
      <!-- Recipe Hero Image (Optional) -->
      <div id="detailImageContainer" class="hidden w-full h-52 rounded-2xl overflow-hidden shadow-sm">
        <img id="detailImage" src="" alt="Recipe image" class="w-full h-full object-cover">
      </div>

      <div id="detailHeader"></div>

      <!-- Portions Scaler & Metric Toggle Controls -->
      <div class="p-4 bg-zinc-100/80 dark:bg-zinc-900 rounded-2xl border border-zinc-200/70 dark:border-zinc-800 flex flex-wrap items-center justify-between gap-3">
        <div>
          <span class="text-[10px] font-bold uppercase tracking-wider text-zinc-400">Serving Portions</span>
          <div class="flex items-center gap-2 mt-1">
            <button onclick="adjustServings(-1)" class="w-7 h-7 rounded-lg bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 text-zinc-900 dark:text-white font-bold flex items-center justify-center active:scale-95">-</button>
            <span id="detailServesDisplay" class="font-black text-sm text-zinc-900 dark:text-white min-w-[50px] text-center">4 serves</span>
            <button onclick="adjustServings(1)" class="w-7 h-7 rounded-lg bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 text-zinc-900 dark:text-white font-bold flex items-center justify-center active:scale-95">+</button>
            <span id="servingsMultiplierBadge" class="text-[10px] font-mono font-bold px-1.5 py-0.5 rounded bg-accent-subtle text-accent-text ml-1">1x</span>
          </div>
        </div>

        <button onclick="toggleMetricUnits()" id="btnMetricToggle" class="px-3 py-1.5 rounded-xl text-xs font-bold border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-800 text-zinc-700 dark:text-zinc-200 active:scale-95 transition">
          Convert to Metric
        </button>
      </div>
      
      <!-- Ingredients Section -->
      <div>
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-xs font-bold uppercase tracking-wider text-zinc-400">Ingredients</h3>
          <button onclick="addRecipeIngredientsToGrocery()" class="text-xs text-accent font-semibold flex items-center gap-1 active:opacity-75">
            + Add to Groceries
          </button>
        </div>
        <div id="detailIngredients" class="space-y-2"></div>
      </div>

      <!-- Instructions Section -->
      <div>
        <h3 class="text-xs font-bold uppercase tracking-wider text-zinc-400 mb-2">Instructions</h3>
        <div id="detailInstructions" class="space-y-3"></div>
      </div>
    </div>
  </div>

  <!-- ================= AI IMPORT MODAL ================= -->
  <div id="importModal" class="fixed inset-0 z-50 bg-black/60 hidden backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white dark:bg-zinc-900 w-full max-w-md rounded-t-3xl sm:rounded-2xl max-h-[90vh] overflow-y-auto p-6 space-y-4 shadow-2xl relative text-zinc-900 dark:text-white">
      
      <div class="flex justify-between items-center border-b dark:border-zinc-800 pb-3">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-full bg-accent-subtle text-accent flex items-center justify-center font-bold">✨</div>
          <h3 class="font-bold text-base">AI Recipe Importer</h3>
        </div>
        <button id="btnCloseImport" onclick="closeImportModal()" class="text-zinc-400 p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Optional Image URL & AI Photo Option -->
      <div class="bg-zinc-50 dark:bg-zinc-800/50 border border-zinc-200 dark:border-zinc-800 rounded-xl p-3 space-y-2">
        <label class="text-[11px] font-bold text-zinc-500 uppercase tracking-wider">Recipe Photo (Optional)</label>
        <input type="text" id="importCustomImageUrl" placeholder="Paste image URL (or leave blank)" class="w-full bg-white dark:bg-zinc-800 border dark:border-zinc-700 rounded-lg px-2.5 py-1.5 text-xs outline-none focus:ring-2 focus:ring-accent">
        <label class="flex items-center gap-2 text-xs text-zinc-600 dark:text-zinc-300 cursor-pointer pt-1">
          <input type="checkbox" id="importAutoAiImage" checked class="w-4 h-4 rounded text-accent accent-accent">
          <span>Auto-generate appetizing food photo with AI</span>
        </label>
      </div>

      <!-- Import Channels -->
      <div id="importChannelsContainer" class="space-y-3 pt-1">
        <!-- Photo/Scan -->
        <label class="flex items-center gap-3 p-3.5 border border-zinc-200 dark:border-zinc-800 rounded-2xl hover:bg-zinc-50 dark:hover:bg-zinc-800 active:scale-[0.99] transition cursor-pointer">
          <div class="w-10 h-10 rounded-xl bg-blue-50 dark:bg-blue-950 text-blue-600 dark:text-blue-400 flex items-center justify-center">

  <!-- ================= APP JAVASCRIPT ================= -->
  <script>
    const defaultData = {
      recipes: [
        {
          id: '1',
          name: 'Classic Lemon Garlic Salmon',
          serves: 4,
          prep: 10,
          cook: 15,
          tag: 'Dinner',
          image: 'https://images.unsplash.com/photo-1467003909585-2f8a72700288?w=800&auto=format&fit=crop&q=80',
          ingredients: ['2 Salmon fillets', '2 cloves Garlic, minced', '1 Lemon, sliced', '2 tbsp Olive oil', '1/2 cup White wine or broth', 'Fresh dill to garnish'],
          instructions: ['Preheat oven to 400°F (200°C).', 'Place salmon on foil-lined baking sheet.', 'Rub with olive oil, minced garlic, salt, and pepper.', 'Top with lemon slices and bake for 12-15 minutes.']
        }
      ],
      tags: ['Dinner', 'Baking', 'Quick', 'Vegetarian', 'Breakfast', 'Dessert'],
      grocery: [
        { id: 'g1', text: 'Olive oil', done: false }
      ]
    };

    function loadAppData() {
      try {
        const raw = localStorage.getItem('savor_data');
        if (!raw) return defaultData;
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.recipes)) {
          if (!Array.isArray(parsed.grocery)) parsed.grocery = [];
          if (!Array.isArray(parsed.tags)) parsed.tags = defaultData.tags;
          return parsed;
        }
      } catch (err) {
        console.warn('Recovered corrupted data back to defaults', err);
      }
      return defaultData;
    }

    let appData = loadAppData();
    let selectedCategory = 'All';
    let currentActiveRecipeId = null;
    let wakeLock = null;
    let isAiExtracting = false;

    // Servings & Metric State for Detail Modal
    let currentServings = 4;
    let baseServings = 4;
    let isMetricMode = false;
    let checkedIngredients = new Set();

    let driveAccessToken = localStorage.getItem('savor_drive_token') || null;
    let driveTokenExp = Number(localStorage.getItem('savor_drive_token_exp') || 0);
    let driveFileId = localStorage.getItem('savor_drive_file_id') || null;

    // ================= THEME & CUSTOMIZATION =================
    function initThemeAndAccent() {
      const savedTheme = localStorage.getItem('savor_theme_mode') || 'system';
      const savedAccent = localStorage.getItem('savor_accent_color') || 'emerald';
      applyTheme(savedTheme);
      applyAccent(savedAccent);
    }

    function applyTheme(mode) {
      localStorage.setItem('savor_theme_mode', mode);
      const isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', isDark);

      ['light', 'dark', 'system'].forEach(m => {
        const btn = document.getElementById(`themeBtn-${m}`);
        if (btn) {
          if (m === mode) {
            btn.className = 'p-2.5 rounded-xl border-2 border-accent bg-accent-subtle text-accent-text text-xs font-bold flex items-center justify-center gap-1.5';
          } else {
            btn.className = 'p-2.5 rounded-xl border border-zinc-200 dark:border-zinc-700 text-xs font-semibold flex items-center justify-center gap-1.5';
          }
        }
      });
    }

    function setThemeMode(mode) {
      applyTheme(mode);
      showToast(`Theme updated to ${mode}`);
    }

    function applyAccent(color) {
      localStorage.setItem('savor_accent_color', color);
      document.documentElement.setAttribute('data-theme-color', color);
    }

    function setAccentColor(color) {
      applyAccent(color);
      showToast(`Accent color updated!`);
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toastNotification');
      const msgEl = document.getElementById('toastMessage');
      const iconEl = document.getElementById('toastIcon');
      if (!toast || !msgEl) return;

      msgEl.textContent = msg;
      if (isError) {
        iconEl.textContent = '✕';
        iconEl.className = 'w-6 h-6 rounded-full bg-rose-500/20 text-rose-500 flex items-center justify-center text-xs font-bold';
      } else {
        iconEl.textContent = '✨';
        iconEl.className = 'w-6 h-6 rounded-full bg-accent-subtle text-accent flex items-center justify-center text-xs font-bold';
      }

      toast.classList.remove('opacity-0', '-translate-y-4');
      toast.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-4');
      }, 3500);
    }

    function saveData() {
      try {
        localStorage.setItem('savor_data', JSON.stringify(appData));
      } catch (e) {
        console.error('Save error', e);
      }
    }

    function checkExistingAuth() {
      const now = Date.now();
      if (driveAccessToken && now < driveTokenExp) {
        updateSyncStatus('connected');
      } else {
        driveAccessToken = null;
        updateSyncStatus('disconnected');
      }
    }

    function updateSyncStatus(status) {
      const el = document.getElementById('syncStatus');
      if (!el) return;
      if (status === 'connected') {
        el.innerHTML = '<span class="w-2 h-2 rounded-full bg-accent inline-block"></span> Connected to Drive';
      } else if (status === 'syncing') {
        el.innerHTML = '<span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse inline-block"></span> Syncing...';
      } else {
        el.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-400 inline-block"></span> Local only';
      }
    }

    // ================= RECIPE SCALING & METRIC CONVERTERS =================
    function scaleQuantity(str, factor) {
      if (factor === 1) return str;
      const match = str.trim().match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d*\.?\d+)\s*(.*)$/);
      if (!match) return str;
      const qtyStr = match[1];
      const rest = match[2];
      let val = 0;
      try {
        if (qtyStr.includes(' ') && qtyStr.includes('/')) {
          const parts = qtyStr.split(' ');
          const fracParts = parts[1].split('/');
          val = parseFloat(parts[0]) + (parseFloat(fracParts[0]) / parseFloat(fracParts[1]));
        } else if (qtyStr.includes('/')) {
          const fracParts = qtyStr.split('/');
          val = parseFloat(fracParts[0]) / parseFloat(fracParts[1]);
        } else {
          val = parseFloat(qtyStr);
        }
        const newVal = val * factor;
        let formatted = '';
        if (Math.abs(newVal - Math.round(newVal)) < 0.01) {
          formatted = Math.round(newVal).toString();
        } else if (Math.abs(newVal * 2 - Math.round(newVal * 2)) < 0.05) {
          formatted = (Math.round(newVal * 2) / 2).toString();
        } else {
          formatted = newVal.toFixed(1).replace(/\.0$/, '');
        }
        return `${formatted} ${rest}`;
      } catch (e) {
        return str;
      }
    }

    function convertToMetric(line) {
      let res = line;
      res = res.replace(/(\d*\.?\d+)\s*(?:ounces|ounce|oz)\b/gi, (m, p1) => `${Math.round(parseFloat(p1) * 28.35)}g`);
      res = res.replace(/(\d*\.?\d+)\s*(?:pounds|pound|lbs|lb)\b/gi, (m, p1) => {
        const val = parseFloat(p1);
        return val >= 2.2 ? `${(val * 0.453592).toFixed(1)}kg` : `${Math.round(val * 453.592)}g`;
      });
      res = res.replace(/(\d*\.?\d+)\s*(?:cups|cup)\b/gi, (m, p1) => `${Math.round(parseFloat(p1) * 240)}ml`);
      res = res.replace(/(\d*\.?\d+)\s*(?:tablespoons|tablespoon|tbsp)\b/gi, (m, p1) => `${Math.round(parseFloat(p1) * 15)}ml`);
      res = res.replace(/(\d*\.?\d+)\s*(?:teaspoons|teaspoon|tsp)\b/gi, (m, p1) => `${Math.round(parseFloat(p1) * 5)}ml`);
      res = res.replace(/(\d+)\s*(?:°F|degrees\s*F(?:ahrenheit)?)\b/gi, (m, p1) => `${Math.round((parseFloat(p1) - 32) * 5 / 9)}°C`);
      return res;
    }

    function updateIngredientsDisplay() {
      const r = appData.recipes.find(x => x.id === currentActiveRecipeId);
      if (!r) return;

      const factor = currentServings / baseServings;
      document.getElementById('detailServesDisplay').textContent = `${currentServings} serves`;
      document.getElementById('servingsMultiplierBadge').textContent = `${factor.toFixed(1).replace(/\.0$/, '')}x`;
      document.getElementById('btnMetricToggle').textContent = isMetricMode ? 'Show Original Units' : 'Convert to Metric';

      document.getElementById('detailIngredients').innerHTML = (r.ingredients || []).map((ing, idx) => {
        let scaled = scaleQuantity(ing, factor);
        if (isMetricMode) scaled = convertToMetric(scaled);
        const isChecked = checkedIngredients.has(idx);

        return `
          <label class="flex items-center gap-3 p-2.5 rounded-xl transition cursor-pointer select-none border border-transparent ${isChecked ? 'opacity-40 bg-zinc-100/60 dark:bg-zinc-800/40' : 'hover:bg-zinc-50 dark:hover:bg-zinc-850'}">
            <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleIngredientCheck(${idx})" 
              class="w-4 h-4 rounded text-accent accent-accent cursor-pointer">
            <span class="text-sm font-medium leading-snug transition ${isChecked ? 'line-through text-zinc-400 dark:text-zinc-500' : 'text-zinc-800 dark:text-zinc-200'}">
              ${scaled}

      }).join('');

    function toggleIngredientCheck(idx) {
      if (checkedIngredients.has(idx)) {
        checkedIngredients.delete(idx);
      } else {
        checkedIngredients.add(idx);
      }
      updateIngredientsDisplay();
    }

    function adjustServings(delta) {
      if (currentServings + delta < 1) return;
      currentServings += delta;

    function toggleMetricUnits() {
      isMetricMode = !isMetricMode;
      updateIngredientsDisplay();

    // EDGE SWIPE TO GO BACK
    let touchStartX = 0;
    let touchStartY = 0;
    const detailModal = document.getElementById('recipeDetailModal');

    detailModal.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    detailModal.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;
      const diffX = touchEndX - touchStartX;
      const diffY = Math.abs(touchEndY - touchStartY);

      if (touchStartX < 45 && diffX > 60 && diffY < 90) {
        closeRecipeDetail();
      }
    }, { passive: true });

    // WAKE LOCK API (Screen Keep Awake)
    async function toggleWakeLock() {
      const btn = document.getElementById('wakeLockBtn');
      if (!wakeLock) {
        if ('wakeLock' in navigator) {
          try {
            wakeLock = await navigator.wakeLock.request('screen');
            btn.classList.add('bg-amber-100', 'text-amber-800', 'dark:bg-amber-950', 'dark:text-amber-300');
            btn.querySelector('span').textContent = 'Awake ON';
          } catch (err) {
            console.error(err);
          }
        }
      } else {
        await wakeLock.release();
        wakeLock = null;
        btn.classList.remove('bg-amber-100', 'text-amber-800', 'dark:bg-amber-950', 'dark:text-amber-300');
        btn.querySelector('span').textContent = 'Keep Awake';
      }
    }

    function saveRecipe() {
      const id = document.getElementById('editRecipeId').value || Date.now().toString();
      const name = document.getElementById('editName').value.trim();
      if (!name) return alert('Recipe title is required');

      const ingredients = document.getElementById('editIngredients').value.split('\n').map(s => s.trim()).filter(Boolean);
      const instructions = document.getElementById('editInstructions').value.split('\n').map(s => s.trim()).filter(Boolean);

      const recipe = {
        id,
        name,
        serves: Number(document.getElementById('editServes').value) || 4,
        prep: document.getElementById('editPrep').value,
        cook: document.getElementById('editCook').value,
        tag: document.getElementById('editTag').value.trim() || 'General',
        image: document.getElementById('editImage').value.trim(),
        ingredients,
        instructions
      };

      // Add tag to tags list if new
      if (recipe.tag && !appData.tags.includes(recipe.tag)) {
        appData.tags.push(recipe.tag);
        renderCategoryPills();
      }

      const existingIndex = appData.recipes.findIndex(r => r.id === id);
      if (existingIndex > -1) {
        appData.recipes[existingIndex] = recipe;
      } else {
        appData.recipes.unshift(recipe);
      }

      saveData();
      renderRecipes();
      closeRecipeEditor();
      if (!document.getElementById('recipeDetailModal').classList.contains('hidden')) {
        openRecipeDetail(id);
      }
      autoSyncToDrive();
      showToast('Recipe saved successfully!');

    // ================= AI RECIPE IMPORTER (With Tags & Images) =================
    function getGeminiKey() {

    }

    function openImportModal() {
      if (isAiExtracting) return;
      document.getElementById('importModal').classList.remove('hidden');
      setAiModalLoadingState(false);
    }

    function closeImportModal() {
      if (isAiExtracting) return;
      document.getElementById('importModal').classList.add('hidden');

    function setAiModalLoadingState(loading) {
      const banner = document.getElementById('aiLoadingBanner');
      const channels = document.getElementById('importChannelsContainer');
      const closeBtn = document.getElementById('btnCloseImport');
      const fetchBtn = document.getElementById('btnFetchUrl');
      const textBtn = document.getElementById('btnExtractText');

      if (loading) {
        banner.classList.remove('hidden');
        channels.classList.add('opacity-40', 'pointer-events-none');
        closeBtn.classList.add('opacity-30', 'pointer-events-none');
        if (fetchBtn) fetchBtn.disabled = true;
        if (textBtn) textBtn.disabled = true;
      } else {
        banner.classList.add('hidden');
        channels.classList.remove('opacity-40', 'pointer-events-none');
        closeBtn.classList.remove('opacity-30', 'pointer-events-none');
        if (fetchBtn) fetchBtn.disabled = false;
        if (textBtn) textBtn.disabled = false;

    async function handleFileSelected(inputElement, type) {
      if (isAiExtracting) return;
      const file = inputElement.files[0];
      if (!file) return;

      const apiKey = getGeminiKey();
      if (!apiKey) return alert('Please enter your Gemini API key in Settings first.');

      isAiExtracting = true;
      setAiModalLoadingState(true);

      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const base64Data = reader.result.split(',')[1];
          const recipe = await runAiExtraction({
            fileBase64: base64Data,
            mimeType: file.type || (type === 'pdf' ? 'application/pdf' : 'image/jpeg')
          });
          applyImportImageOption(recipe);
          onAiSuccess(recipe);
        } catch (err) {
          showToast(err.message || 'File extraction failed', true);
        } finally {
          isAiExtracting = false;
          setAiModalLoadingState(false);
          inputElement.value = '';
        }
      };
      reader.onerror = () => {
        isAiExtracting = false;
        setAiModalLoadingState(false);
        showToast('Error reading file', true);
      };
      reader.readAsDataURL(file);
    }

    async function handleTextImport() {
      if (isAiExtracting) return;
      const text = document.getElementById('importRawText').value.trim();
      if (!text) return alert('Please paste some recipe text first.');

      const apiKey = getGeminiKey();
      if (!apiKey) return alert('Please enter your Gemini API key in Settings first.');

      isAiExtracting = true;
      setAiModalLoadingState(true);

      try {
        const recipe = await runAiExtraction({ text });
        document.getElementById('importRawText').value = '';
        applyImportImageOption(recipe);
        onAiSuccess(recipe);
      } catch (err) {
        showToast(err.message || 'Extraction failed', true);
      } finally {
        isAiExtracting = false;
        setAiModalLoadingState(false);
      }
    }

    async function fetchWebPageText(rawUrl) {
      let targetUrl = rawUrl.trim();
      if (!/^https?:\/\//i.test(targetUrl)) targetUrl = 'https://' + targetUrl;

      let htmlOrText = null;
      try {
        const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.contents) htmlOrText = data.contents;
        }
      } catch (_) {}

      if (!htmlOrText) {
        try {
          const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(targetUrl)}`);
          if (res.ok) htmlOrText = await res.text();
        } catch (_) {}
      }

      if (!htmlOrText) {
        try {
          const res = await fetch(`https://r.jina.ai/${targetUrl}`);
          if (res.ok) htmlOrText = await res.text();
        } catch (_) {}
      }

      if (!htmlOrText) throw new Error("Could not load page automatically. Tip: Copy text directly into 'Paste Recipe Text'!");
      return htmlOrText.slice(0, 15000);
    }

    async function handleUrlImport() {
      if (isAiExtracting) return;
      const urlInput = document.getElementById('importUrlInput');
      const url = urlInput ? urlInput.value.trim() : '';
      if (!url) return alert('Please enter a recipe URL.');

      const apiKey = getGeminiKey();
      if (!apiKey) return alert('Please enter your Gemini API key in Settings first.');

      isAiExtracting = true;
      setAiModalLoadingState(true);

      try {
        const pageContent = await fetchWebPageText(url);
        const recipe = await runAiExtraction({ text: `Recipe web page contents:\n\n${pageContent}` });
        if (urlInput) urlInput.value = '';
        applyImportImageOption(recipe);
        onAiSuccess(recipe);
      } catch (err) {
        showToast(err.message, true);
      } finally {
        isAiExtracting = false;
        setAiModalLoadingState(false);
      }
    }

    function applyImportImageOption(recipe) {
      const customImg = document.getElementById('importCustomImageUrl').value.trim();
      const autoAi = document.getElementById('importAutoAiImage').checked;

      if (customImg) {
        recipe.image = customImg;
      } else if (autoAi && recipe.name) {
        const prompt = `Artisan food photography of ${recipe.name}, professional culinary presentation, studio lighting, 4k`;
        recipe.image = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=800&height=500&nologo=true`;
      }
    }

    function onAiSuccess(recipe) {
      document.getElementById('importModal').classList.add('hidden');
      openRecipeEditor(recipe);
      showToast(`✨ Extracted "${recipe.name}"!`);
    }

    async function runAiExtraction({ text = '', fileBase64 = '', mimeType = '' }) {
      const apiKey = getGeminiKey();
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;

      const parts = [];
      if (fileBase64 && mimeType) {
        parts.push({
          inline_data: {
            mime_type: mimeType,
            data: fileBase64
          }
        });
      }

      const availableTagsStr = (appData.tags || []).join(', ');
      const systemPrompt = `Extract the complete recipe into clean structured JSON.
Rules:
- "name": Recipe title
- "serves": Number of servings (default 4 if unspecified)
- "prep": Prep time in minutes
- "cook": Cook time in minutes
- "tag": Select the single most relevant category strictly from these available tags: [${availableTagsStr}]. If none match, choose a single concise category word.
- "ingredients": Array of ingredient strings with quantities
- "instructions": Array of step-by-step instructions`;

      if (text) {
        parts.push({ text: `${systemPrompt}\n\nContent:\n${text}` });
      } else {
        parts.push({ text: systemPrompt });
      }

      const payload = {
        contents: [{ parts }],
        generationConfig: {
          response_mime_type: 'application/json',
          response_schema: {
            type: 'OBJECT',
            properties: {
              name: { type: 'STRING' },
              serves: { type: 'NUMBER' },
              prep: { type: 'NUMBER' },
              cook: { type: 'NUMBER' },
              tag: { type: 'STRING' },
              ingredients: { type: 'ARRAY', items: { type: 'STRING' } },
              instructions: { type: 'ARRAY', items: { type: 'STRING' } }
            },
            required: ['name', 'ingredients', 'instructions']
          }
        }
      };

      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.error?.message || `API request failed with code ${res.status}`);
      }

      const data = await res.json();
      const textResponse = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!textResponse) throw new Error('No content returned from AI');
      return JSON.parse(textResponse);
    }

    // ================= SETTINGS & TAG MANAGEMENT =================
    function openSettingsModal() {
      document.getElementById('gdriveClientId').value = localStorage.getItem('savor_client_id') || '';
      document.getElementById('geminiApiKeyInput').value = localStorage.getItem('savor_gemini_key') || '';
      renderSettingsTags();
      document.getElementById('settingsModal').classList.remove('hidden');
    }

    function closeSettingsModal() {
      document.getElementById('settingsModal').classList.add('hidden');
    }

    function renderSettingsTags() {
      const container = document.getElementById('settingsTagList');
      container.innerHTML = (appData.tags || []).map((t, idx) => `
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-zinc-100 dark:bg-zinc-800 text-zinc-800 dark:text-zinc-200 border border-zinc-200 dark:border-zinc-700">
          ${t}
          <button onclick="removeTag(${idx})" class="text-zinc-400 hover:text-rose-500 font-bold ml-1">✕</button>
        </span>
      `).join('');
    }

    function removeTag(idx) {
      const removed = appData.tags.splice(idx, 1)[0];
      saveData();
      renderSettingsTags();
      renderCategoryPills();
      showToast(`Tag "${removed}" removed`);
    }

    function addNewTagFromSettings() {
      const input = document.getElementById('newTagInput');
      const tag = input.value.trim();
      if (!tag) return;
      if (!appData.tags.includes(tag)) {
        appData.tags.push(tag);
        saveData();
        renderSettingsTags();
        renderCategoryPills();
        input.value = '';
        showToast(`Tag "${tag}" added!`);
      }
    }

    async function triggerAiScanForTags() {
      const apiKey = getGeminiKey();
      if (!apiKey) return alert('Please save your Gemini API key in Settings first.');
      if (!appData.recipes || appData.recipes.length === 0) return alert('No recipes available to scan.');

      const tagToScan = prompt(`Enter which tag you want AI to scan & assign to your recipes (e.g. Vegetarian, Dinner, Baking):`);
      if (!tagToScan || !tagToScan.trim()) return;
      const cleanTag = tagToScan.trim();

      showToast(`🤖 AI scanning ${appData.recipes.length} recipes for "${cleanTag}"...`);

      const recipeSummaries = appData.recipes.map(r => `ID: ${r.id} | Name: ${r.name} | Ingredients: ${(r.ingredients || []).join(', ')}`).join('\n');
      const promptText = `Determine which recipes belong to the category/tag "${cleanTag}".\n\nRecipes:\n${recipeSummaries}`;

      try {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }],
            generationConfig: {
              response_mime_type: 'application/json',
              response_schema: {
                type: 'OBJECT',
                properties: {
                  matching_ids: {
                    type: 'ARRAY',
                    items: { type: 'STRING' }
                  }
                },
                required: ['matching_ids']
              }
            }
          })
        });

        const data = await res.json();
        const parsed = JSON.parse(data.candidates[0].content.parts[0].text);
        const matchIds = parsed.matching_ids || [];

        let count = 0;
        appData.recipes.forEach(r => {
          if (matchIds.includes(r.id.toString())) {
            r.tag = cleanTag;
            count++;
          }
        });

        if (!appData.tags.includes(cleanTag)) appData.tags.push(cleanTag);
        saveData();
        renderCategoryPills();
        renderRecipes();
        renderSettingsTags();
        autoSyncToDrive();
        showToast(`✨ AI tagged ${count} recipes as "${cleanTag}"!`);
      } catch (err) {
        showToast('AI Tag scan failed: ' + err.message, true);
      }
    }

    function saveGeminiKeyFromSettings() {
      const val = document.getElementById('geminiApiKeyInput').value.trim();
      localStorage.setItem('savor_gemini_key', val);
      showToast('Gemini API Key saved!');
    }

    // ================= GOOGLE DRIVE CLOUD SYNC =================
    function initiateGoogleDriveSync() {
      const inputVal = document.getElementById('gdriveClientId').value.trim();
      if (inputVal) {
        localStorage.setItem('savor_client_id', inputVal);
      }
      
      const clientId = inputVal || localStorage.getItem('savor_client_id') || '';
      if (!clientId) {
        alert('Please enter your Google Cloud OAuth Client ID.');
        return;
      }

      if (!window.google || !google.accounts || !google.accounts.oauth2) {
        alert('Google Services library is loading. Please check your connection and retry.');
        return;
      }

      const client = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: 'https://www.googleapis.com/auth/drive.file',
        callback: async (tokenResponse) => {
          if (tokenResponse && tokenResponse.access_token) {
            driveAccessToken = tokenResponse.access_token;
            const expiresIn = (tokenResponse.expires_in || 3600) * 1000;
            driveTokenExp = Date.now() + expiresIn - 120000;

            localStorage.setItem('savor_drive_token', driveAccessToken);
            localStorage.setItem('savor_drive_token_exp', driveTokenExp.toString());

            updateSyncStatus('connected');
            closeSettingsModal();
            await pullOrPushDriveData();
          }
        }
      });
      client.requestAccessToken();
    }

    async function pullOrPushDriveData() {
      if (!driveAccessToken) return;
      updateSyncStatus('syncing');
      try {
        const searchRes = await fetch("https://www.googleapis.com/drive/v3/files?q=name='savor_vault.json' and trashed=false", {
          headers: { Authorization: `Bearer ${driveAccessToken}` }
        });
        const searchData = await searchRes.json();

        if (searchData.files && searchData.files.length > 0) {
          driveFileId = searchData.files[0].id;
          localStorage.setItem('savor_drive_file_id', driveFileId);

          const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`, {
            headers: { Authorization: `Bearer ${driveAccessToken}` }
          });
          const remoteJson = await fileRes.json();
          if (remoteJson && remoteJson.recipes) {
            appData = remoteJson;
            saveData();
            renderCategoryPills();
            renderRecipes();
            showToast('Synced with Google Drive!');
          }
        } else {
          await createDriveFile();
        }
        updateSyncStatus('connected');
      } catch (err) {
        console.error('Drive sync error', err);
        updateSyncStatus('connected');
      }
    }

    async function createDriveFile() {
      const metadata = { name: 'savor_vault.json', mimeType: 'application/json' };
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
      form.append('file', new Blob([JSON.stringify(appData)], { type: 'application/json' }));

      const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST',
        headers: { Authorization: `Bearer ${driveAccessToken}` },
        body: form
      });
      const data = await res.json();
      driveFileId = data.id;
      localStorage.setItem('savor_drive_file_id', driveFileId);
      showToast('Created savor_vault.json in Drive!');
    }

    async function autoSyncToDrive() {
      if (!driveAccessToken || !driveFileId) return;
      try {
        await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
          method: 'PATCH',
          headers: {
            Authorization: `Bearer ${driveAccessToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(appData)
        });
      } catch (e) {
        console.warn('Auto-sync failed', e);
      }
    }

    function exportJSONBackup() {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `savor_backup_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
    }

    // App Initialization
    initThemeAndAccent();
    checkExistingAuth();
    renderCategoryPills();
    renderRecipes();
  </script>
</body>
</html>
