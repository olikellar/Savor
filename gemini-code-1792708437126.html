<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Savor — Recipe Vault</title>

  <!-- iOS PWA Configuration -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Savor">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    /* Prevent rubber-banding and respect iOS notch/home bar */
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea { user-select: auto; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-900 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- ================= TOP HEADER ================= -->
  <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-zinc-200/80 px-4 py-3 flex items-center justify-between">
    <div>
      <h1 class="text-xl font-bold tracking-tight text-zinc-900">Savor</h1>
      <p id="syncStatus" class="text-xs text-zinc-500 flex items-center gap-1">
        <span class="w-2 h-2 rounded-full bg-amber-400 inline-block"></span> Local only
      </p>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="openSyncModal()" class="p-2 rounded-full hover:bg-zinc-100 text-zinc-600 transition">
        <i data-lucide="cloud" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <!-- ================= MAIN CONTENT VIEWS ================= -->
  <main class="flex-1 overflow-y-auto pb-24 px-4 pt-4 max-w-xl mx-auto w-full">
    
    <!-- VIEW 1: RECIPES LIST -->
    <section id="view-recipes" class="space-y-4">
      <!-- Search & Filter -->
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-3.5 text-zinc-400"></i>
        <input type="text" id="searchInput" oninput="renderRecipes()" placeholder="Search recipes, ingredients, tags..."
          class="w-full bg-zinc-100/90 rounded-2xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 border border-transparent focus:bg-white transition">
      </div>

      <!-- Category Filter Pills -->
      <div id="categoryPills" class="flex gap-2 overflow-x-auto hide-scrollbar py-1 text-xs font-medium">
        <button onclick="filterCategory('All')" class="cat-pill active bg-zinc-900 text-white px-3.5 py-1.5 rounded-full">All</button>
        <button onclick="filterCategory('Dinner')" class="cat-pill bg-zinc-200/70 text-zinc-700 px-3.5 py-1.5 rounded-full">Dinner</button>
        <button onclick="filterCategory('Baking')" class="cat-pill bg-zinc-200/70 text-zinc-700 px-3.5 py-1.5 rounded-full">Baking</button>
        <button onclick="filterCategory('Quick')" class="cat-pill bg-zinc-200/70 text-zinc-700 px-3.5 py-1.5 rounded-full">Quick</button>
      </div>

      <!-- Recipe Cards Grid -->
      <div id="recipeList" class="grid grid-cols-1 gap-3.5">
        <!-- Rendered by JS -->
      </div>
    </section>

    <!-- VIEW 2: SHOPPING LIST -->
    <section id="view-shopping" class="hidden space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold">Shopping List</h2>
        <button onclick="clearCheckedGrocery()" class="text-xs text-rose-600 font-medium">Clear Checked</button>
      </div>

      <div class="flex gap-2">
        <input type="text" id="newGroceryInput" placeholder="Add custom item..." 
          class="flex-1 bg-zinc-100 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
        <button onclick="addCustomGrocery()" class="bg-zinc-900 text-white px-4 py-2 rounded-xl text-sm font-medium">Add</button>
      </div>

      <div id="shoppingListContainer" class="space-y-2 pt-2">
        <!-- Rendered by JS -->
      </div>
    </section>
  </main>

  <!-- ================= BOTTOM NAVIGATION BAR ================= -->
  <nav class="fixed bottom-0 left-0 right-0 z-30 bg-white/90 backdrop-blur-md border-t border-zinc-200 px-6 py-2 flex justify-around items-center max-w-xl mx-auto">
    <button onclick="switchTab('recipes')" id="tab-recipes" class="nav-tab active flex flex-col items-center text-emerald-600 gap-1">
      <i data-lucide="book-open" class="w-5 h-5"></i>
      <span class="text-[10px] font-semibold">Recipes</span>
    </button>
    <button onclick="openRecipeEditor()" class="flex flex-col items-center text-zinc-400 hover:text-zinc-900 gap-1">
      <div class="bg-emerald-600 text-white p-2.5 rounded-full shadow-lg shadow-emerald-600/30 -mt-5">
        <i data-lucide="plus" class="w-5 h-5"></i>
      </div>
      <span class="text-[10px] font-medium text-zinc-600">Add</span>
    </button>
    <button onclick="switchTab('shopping')" id="tab-shopping" class="nav-tab flex flex-col items-center text-zinc-400 gap-1">
      <i data-lucide="shopping-bag" class="w-5 h-5"></i>
      <span class="text-[10px] font-semibold">Groceries</span>
    </button>
  </nav>

  <!-- ================= RECIPE DETAIL / COOKING MODAL ================= -->
  <div id="recipeDetailModal" class="fixed inset-0 z-40 bg-white hidden flex flex-col overflow-y-auto">
    <div class="sticky top-0 bg-white/90 backdrop-blur-md border-b border-zinc-200 p-4 flex items-center justify-between">
      <button onclick="closeRecipeDetail()" class="text-zinc-600 p-1"><i data-lucide="arrow-left" class="w-6 h-6"></i></button>
      <div class="flex items-center gap-3">
        <button id="wakeLockBtn" onclick="toggleWakeLock()" title="Keep screen awake" class="flex items-center gap-1.5 text-xs bg-zinc-100 px-3 py-1.5 rounded-full font-medium text-zinc-700">
          <i data-lucide="sun" class="w-4 h-4"></i> Keep Awake
        </button>
        <button onclick="editCurrentRecipe()" class="text-zinc-600 p-1"><i data-lucide="edit-3" class="w-5 h-5"></i></button>
      </div>
    </div>

    <div class="p-6 max-w-xl mx-auto w-full space-y-6 pb-28">
      <div id="detailHeader"></div>
      
      <div>
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-sm font-bold uppercase tracking-wider text-zinc-400">Ingredients</h3>
          <button onclick="addRecipeIngredientsToGrocery()" class="text-xs text-emerald-600 font-semibold flex items-center gap-1">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i> Add to Groceries
          </button>
        </div>
        <div id="detailIngredients" class="space-y-2"></div>
      </div>

      <div>
        <h3 class="text-sm font-bold uppercase tracking-wider text-zinc-400 mb-2">Instructions</h3>
        <div id="detailInstructions" class="space-y-3"></div>
      </div>
    </div>
  </div>

  <!-- ================= RECIPE EDITOR MODAL ================= -->
  <div id="recipeEditorModal" class="fixed inset-0 z-50 bg-black/50 hidden backdrop-blur-sm flex items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-2xl max-h-[90vh] overflow-y-auto p-6 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b pb-3">
        <h3 id="editorTitle" class="text-lg font-bold">New Recipe</h3>
        <button onclick="closeRecipeEditor()" class="text-zinc-400"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <input type="hidden" id="editRecipeId">
      <div>
        <label class="text-xs font-semibold text-zinc-500">Title</label>
        <input type="text" id="editName" class="w-full mt-1 border rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="e.g. Garlic Butter Pasta">
      </div>

      <div class="grid grid-cols-3 gap-2">
        <div>
          <label class="text-xs font-semibold text-zinc-500">Prep (m)</label>
          <input type="number" id="editPrep" class="w-full mt-1 border rounded-xl p-2 text-sm outline-none" placeholder="10">
        </div>
        <div>
          <label class="text-xs font-semibold text-zinc-500">Cook (m)</label>
          <input type="number" id="editCook" class="w-full mt-1 border rounded-xl p-2 text-sm outline-none" placeholder="15">
        </div>
        <div>
          <label class="text-xs font-semibold text-zinc-500">Tag</label>
          <input type="text" id="editTag" class="w-full mt-1 border rounded-xl p-2 text-sm outline-none" placeholder="Dinner">
        </div>
      </div>

      <div>
        <label class="text-xs font-semibold text-zinc-500">Ingredients (One per line)</label>
        <textarea id="editIngredients" rows="4" class="w-full mt-1 border rounded-xl p-2.5 text-sm outline-none" placeholder="200g Spaghetti&#10;3 cloves Garlic, sliced&#10;2 tbsp Olive oil"></textarea>
      </div>

      <div>
        <label class="text-xs font-semibold text-zinc-500">Instructions (One step per line)</label>
        <textarea id="editInstructions" rows="4" class="w-full mt-1 border rounded-xl p-2.5 text-sm outline-none" placeholder="Boil pasta in salted water.&#10;Sauté garlic in olive oil until golden.&#10;Toss pasta with oil and serve."></textarea>
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="deleteCurrentEditingRecipe()" id="btnDeleteRecipe" class="hidden text-rose-600 bg-rose-50 px-4 py-2.5 rounded-xl text-sm font-semibold">Delete</button>
        <button onclick="saveRecipe()" class="flex-1 bg-emerald-600 text-white py-2.5 rounded-xl text-sm font-semibold shadow-md shadow-emerald-600/20">Save Recipe</button>
      </div>
    </div>
  </div>

  <!-- ================= GOOGLE DRIVE SYNC MODAL ================= -->
  <div id="syncModal" class="fixed inset-0 z-50 bg-black/50 hidden backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-6 space-y-4 shadow-xl">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold">Cloud Sync (Google Drive)</h3>
        <button onclick="closeSyncModal()"><i data-lucide="x" class="w-5 h-5 text-zinc-400"></i></button>
      </div>
      <p class="text-xs text-zinc-500 leading-relaxed">
        Sync recipes directly to a private <code class="bg-zinc-100 px-1 py-0.5 rounded">savor_vault.json</code> file in your personal Google Drive.
      </p>

      <div>
        <label class="text-xs font-semibold text-zinc-500">OAuth Client ID</label>
        <input type="text" id="gdriveClientId" placeholder="xxxxxx.apps.googleusercontent.com" class="w-full mt-1 border rounded-xl p-2 text-xs font-mono outline-none">
      </div>

      <div class="space-y-2 pt-2">
        <button onclick="initiateGoogleDriveSync()" class="w-full bg-emerald-600 text-white py-2.5 rounded-xl text-sm font-semibold flex items-center justify-center gap-2">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i> Authenticate & Sync
        </button>
        <button onclick="exportJSONBackup()" class="w-full bg-zinc-100 text-zinc-700 py-2.5 rounded-xl text-sm font-semibold">
          Export Local JSON Backup
        </button>
      </div>
    </div>
  </div>

  <!-- ================= APP JAVASCRIPT ================= -->
  <script>
    // Initial Seed Data
    const defaultData = {
      recipes: [
        {
          id: '1',
          name: 'Classic Lemon Garlic Salmon',
          prep: 10,
          cook: 15,
          tag: 'Dinner',
          ingredients: ['2 Salmon fillets', '2 cloves Garlic, minced', '1 Lemon, sliced', '1 tbsp Olive oil', 'Fresh dill to garnish'],
          instructions: ['Preheat oven to 400°F (200°C).', 'Place salmon on foil-lined baking sheet.', 'Rub with olive oil, minced garlic, salt, and pepper.', 'Top with lemon slices and bake for 12-15 minutes.']
        }
      ],
      grocery: [
        { id: 'g1', text: 'Olive oil', done: false }
      ]
    };

    let appData = JSON.parse(localStorage.getItem('savor_data')) || defaultData;
    let selectedCategory = 'All';
    let currentActiveRecipeId = null;
    let wakeLock = null;
    let driveAccessToken = null;
    let driveFileId = null;

    function saveData() {
      localStorage.setItem('savor_data', JSON.stringify(appData));
    }

    // UI RENDERERS
    function renderRecipes() {
      const list = document.getElementById('recipeList');
      const query = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = appData.recipes.filter(r => {
        const matchesCategory = selectedCategory === 'All' || r.tag === selectedCategory;
        const matchesQuery = r.name.toLowerCase().includes(query) || 
                             r.ingredients.some(i => i.toLowerCase().includes(query));
        return matchesCategory && matchesQuery;
      });

      list.innerHTML = filtered.map(r => `
        <div onclick="openRecipeDetail('${r.id}')" class="bg-white p-4 rounded-2xl border border-zinc-200/80 shadow-sm active:scale-[0.99] transition flex justify-between items-center cursor-pointer">
          <div class="space-y-1">
            <span class="inline-block px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-100">${r.tag || 'Recipe'}</span>
            <h4 class="font-bold text-zinc-900 text-base">${r.name}</h4>
            <div class="flex items-center gap-3 text-xs text-zinc-500">
              <span class="flex items-center gap-1"><i data-lucide="clock" class="w-3.5 h-3.5"></i> ${Number(r.prep || 0) + Number(r.cook || 0)} mins</span>
              <span>•</span>
              <span>${r.ingredients.length} items</span>
            </div>
          </div>
          <i data-lucide="chevron-right" class="w-5 h-5 text-zinc-300"></i>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function renderShopping() {
      const container = document.getElementById('shoppingListContainer');
      container.innerHTML = appData.grocery.map(item => `
        <div class="flex items-center justify-between p-3 bg-white rounded-xl border border-zinc-200">
          <label class="flex items-center gap-3 cursor-pointer flex-1">
            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleGrocery('${item.id}')" 
              class="w-5 h-5 rounded-lg text-emerald-600 focus:ring-emerald-500">
            <span class="text-sm ${item.done ? 'line-through text-zinc-400' : 'text-zinc-800'}">${item.text}</span>
          </label>
          <button onclick="removeGrocery('${item.id}')" class="text-zinc-300 hover:text-rose-500 p-1">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        </div>
      `).join('');
      lucide.createIcons();
    }

    // TABS & NAVIGATION
    function switchTab(tab) {
      document.getElementById('view-recipes').classList.toggle('hidden', tab !== 'recipes');
      document.getElementById('view-shopping').classList.toggle('hidden', tab !== 'shopping');
      
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('text-emerald-600'));
      document.getElementById(`tab-${tab}`).classList.add('text-emerald-600');

      if (tab === 'shopping') renderShopping();
      if (tab === 'recipes') renderRecipes();
    }

    function filterCategory(cat) {
      selectedCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(b => {
        b.className = b.textContent === cat 
          ? 'cat-pill bg-zinc-900 text-white px-3.5 py-1.5 rounded-full'
          : 'cat-pill bg-zinc-200/70 text-zinc-700 px-3.5 py-1.5 rounded-full';
      });
      renderRecipes();
    }

    // RECIPE DETAIL & COOKING MODE
    function openRecipeDetail(id) {
      const r = appData.recipes.find(x => x.id === id);
      if (!r) return;
      currentActiveRecipeId = id;

      document.getElementById('detailHeader').innerHTML = `
        <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700 mb-2">${r.tag || 'Recipe'}</span>
        <h2 class="text-2xl font-black text-zinc-900 leading-tight">${r.name}</h2>
        <div class="flex gap-4 mt-3 text-sm text-zinc-600">
          <div><span class="font-bold text-zinc-900">${r.prep || 0}</span> min prep</div>
          <div><span class="font-bold text-zinc-900">${r.cook || 0}</span> min cook</div>
        </div>
      `;

      document.getElementById('detailIngredients').innerHTML = r.ingredients.map(ing => `
        <label class="flex items-center gap-3 p-2 rounded-lg hover:bg-zinc-50 border border-transparent hover:border-zinc-100 cursor-pointer">
          <input type="checkbox" class="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500">
          <span class="text-sm text-zinc-700">${ing}</span>
        </label>
      `).join('');

      document.getElementById('detailInstructions').innerHTML = r.instructions.map((step, idx) => `
        <div class="flex gap-3 text-sm leading-relaxed text-zinc-700">
          <span class="font-bold text-emerald-600">${idx + 1}.</span>
          <p>${step}</p>
        </div>
      `).join('');

      document.getElementById('recipeDetailModal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeRecipeDetail() {
      document.getElementById('recipeDetailModal').classList.add('hidden');
      if (wakeLock) toggleWakeLock(); // Turn off wake lock when leaving
    }

    // WAKE LOCK API (Prevents screen from sleeping while cooking)
    async function toggleWakeLock() {
      const btn = document.getElementById('wakeLockBtn');
      if (!wakeLock) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          btn.classList.add('bg-amber-100', 'text-amber-800');
          btn.innerHTML = `<i data-lucide="sun-medium" class="w-4 h-4"></i> Awake ON`;
        } catch (err) {
          console.error(err);
        }
      } else {
        await wakeLock.release();
        wakeLock = null;
        btn.classList.remove('bg-amber-100', 'text-amber-800');
        btn.innerHTML = `<i data-lucide="sun" class="w-4 h-4"></i> Keep Awake`;
      }
      lucide.createIcons();
    }

    // RECIPE EDITOR
    function openRecipeEditor(recipe = null) {
      document.getElementById('editRecipeId').value = recipe ? recipe.id : '';
      document.getElementById('editName').value = recipe ? recipe.name : '';
      document.getElementById('editPrep').value = recipe ? recipe.prep : '';
      document.getElementById('editCook').value = recipe ? recipe.cook : '';
      document.getElementById('editTag').value = recipe ? recipe.tag : '';
      document.getElementById('editIngredients').value = recipe ? recipe.ingredients.join('\n') : '';
      document.getElementById('editInstructions').value = recipe ? recipe.instructions.join('\n') : '';
      
      document.getElementById('btnDeleteRecipe').classList.toggle('hidden', !recipe);
      document.getElementById('editorTitle').textContent = recipe ? 'Edit Recipe' : 'New Recipe';
      document.getElementById('recipeEditorModal').classList.remove('hidden');
    }

    function closeRecipeEditor() {
      document.getElementById('recipeEditorModal').classList.add('hidden');
    }

    function saveRecipe() {
      const id = document.getElementById('editRecipeId').value || Date.now().toString();
      const name = document.getElementById('editName').value.trim();
      if (!name) return alert('Recipe title is required');

      const ingredients = document.getElementById('editIngredients').value.split('\n').map(s => s.trim()).filter(Boolean);
      const instructions = document.getElementById('editInstructions').value.split('\n').map(s => s.trim()).filter(Boolean);

      const recipe = {
        id,
        name,
        prep: document.getElementById('editPrep').value,
        cook: document.getElementById('editCook').value,
        tag: document.getElementById('editTag').value.trim() || 'General',
        ingredients,
        instructions
      };

      const existingIndex = appData.recipes.findIndex(r => r.id === id);
      if (existingIndex > -1) {
        appData.recipes[existingIndex] = recipe;
      } else {
        appData.recipes.unshift(recipe);
      }

      saveData();
      renderRecipes();
      closeRecipeEditor();
      if (!document.getElementById('recipeDetailModal').classList.contains('hidden')) {
        openRecipeDetail(id);
      }
      autoSyncToDrive();
    }

    function editCurrentRecipe() {
      const r = appData.recipes.find(x => x.id === currentActiveRecipeId);
      if (r) openRecipeEditor(r);
    }

    function deleteCurrentEditingRecipe() {
      const id = document.getElementById('editRecipeId').value;
      if (confirm('Delete this recipe?')) {
        appData.recipes = appData.recipes.filter(r => r.id !== id);
        saveData();
        renderRecipes();
        closeRecipeEditor();
        closeRecipeDetail();
        autoSyncToDrive();
      }
    }

    // SHOPPING LIST
    function addRecipeIngredientsToGrocery() {
      const r = appData.recipes.find(x => x.id === currentActiveRecipeId);
      if (!r) return;
      r.ingredients.forEach(item => {
        appData.grocery.push({ id: Date.now() + Math.random().toString(), text: item, done: false });
      });
      saveData();
      alert('Ingredients transferred to your shopping list!');
    }

    function addCustomGrocery() {
      const input = document.getElementById('newGroceryInput');
      if (!input.value.trim()) return;
      appData.grocery.push({ id: Date.now().toString(), text: input.value.trim(), done: false });
      input.value = '';
      saveData();
      renderShopping();
    }

    function toggleGrocery(id) {
      const item = appData.grocery.find(g => g.id === id);
      if (item) item.done = !item.done;
      saveData();
      renderShopping();
    }

    function removeGrocery(id) {
      appData.grocery = appData.grocery.filter(g => g.id !== id);
      saveData();
      renderShopping();
    }

    function clearCheckedGrocery() {
      appData.grocery = appData.grocery.filter(g => !g.done);
      saveData();
      renderShopping();
    }

    // ================= GOOGLE DRIVE INTEGRATION =================
    function openSyncModal() {
      document.getElementById('gdriveClientId').value = localStorage.getItem('gdrive_client_id') || '';
      document.getElementById('syncModal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeSyncModal() {
      document.getElementById('syncModal').classList.add('hidden');
    }

    function initiateGoogleDriveSync() {
      const clientId = document.getElementById('gdriveClientId').value.trim();
      if (!clientId) return alert('Please enter your Google Cloud OAuth Client ID');
      localStorage.setItem('gdrive_client_id', clientId);

      const client = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: 'https://www.googleapis.com/auth/drive.file',
        callback: async (tokenResponse) => {
          if (tokenResponse && tokenResponse.access_token) {
            driveAccessToken = tokenResponse.access_token;
            document.getElementById('syncStatus').innerHTML = `
              <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span> Connected to Drive
            `;
            closeSyncModal();
            await pullOrPushDriveData();
          }
        }
      });
      client.requestAccessToken();
    }

    async function pullOrPushDriveData() {
      if (!driveAccessToken) return;
      try {
        // Search for existing savor_vault.json
        const searchRes = await fetch("https://www.googleapis.com/drive/v3/files?q=name='savor_vault.json' and trashed=false", {
          headers: { Authorization: `Bearer ${driveAccessToken}` }
        });
        const searchData = await searchRes.json();

        if (searchData.files && searchData.files.length > 0) {
          driveFileId = searchData.files[0].id;
          // Pull remote data
          const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`, {
            headers: { Authorization: `Bearer ${driveAccessToken}` }
          });
          const remoteJson = await fileRes.json();
          if (remoteJson && remoteJson.recipes) {
            appData = remoteJson;
            saveData();
            renderRecipes();
            alert('Synced successfully with Google Drive!');
          }
        } else {
          // File does not exist, upload current state
          await createDriveFile();
        }
      } catch (err) {
        console.error('Drive sync failed', err);
      }
    }

    async function createDriveFile() {
      const metadata = { name: 'savor_vault.json', mimeType: 'application/json' };
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
      form.append('file', new Blob([JSON.stringify(appData)], { type: 'application/json' }));

      const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST',
        headers: { Authorization: `Bearer ${driveAccessToken}` },
        body: form
      });
      const data = await res.json();
      driveFileId = data.id;
      alert('Created new vault file in your Google Drive!');
    }

    async function autoSyncToDrive() {
      if (!driveAccessToken || !driveFileId) return;
      try {
        await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
          method: 'PATCH',
          headers: {
            Authorization: `Bearer ${driveAccessToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(appData)
        });
      } catch (e) {
        console.warn('Auto-sync failed', e);
      }
    }

    function exportJSONBackup() {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `savor_backup_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
    }

    // Init App
    renderRecipes();
    lucide.createIcons();
  </script>
</body>
</html>
